name: CI

# Runs on every branch push. scripts/ship.sh waits for the `verify` check on
# the exact commit before fast-forwarding main to it.
on:
  push:
    branches: ["**"]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/verify.sh
